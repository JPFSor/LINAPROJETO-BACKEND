# =============================================
# Lina - Perfil DEV (H2 em memória)
# Ativo ao rodar localmente sem PostgreSQL
# =============================================

# --- Banco H2 ---
spring.datasource.url=jdbc:h2:mem:linadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Console H2 (acessível em /h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Seed de dados iniciais ---
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql

# --- Log ---
logging.level.com.projeto.lina=DEBUG
logging.level.org.springframework.security=DEBUG
