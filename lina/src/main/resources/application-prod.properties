# =============================================
# Lina - Perfil PROD (PostgreSQL na nuvem)
# Todas as senhas e URLs vêm de variáveis de ambiente
# NUNCA commitar valores reais neste arquivo
# =============================================

# --- Banco PostgreSQL ---
# Variáveis esperadas no ambiente (ex: Railway, Render, Heroku, etc.):
#   DB_URL      = jdbc:postgresql://<host>:<porta>/<banco>
#   DB_USERNAME = seu_usuario
#   DB_PASSWORD = sua_senha
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# SSL obrigatório para o Neon
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.channel_binding=require

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Quebra a dependência circular no Spring Boot 3.5
spring.flyway.depend-on-database-initialization=false

# --- H2 Console DESABILITADO em prod ---
spring.h2.console.enabled=false

# --- Seed de dados ---
# Não rodar scripts de seed em produção automaticamente
spring.sql.init.mode=never

# --- Log ---
logging.level.com.projeto.lina=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN