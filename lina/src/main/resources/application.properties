# =============================================
# Lina - Configuracao Base
# Perfil ativo: definir via variavel de ambiente
# Exemplo: SPRING_PROFILES_ACTIVE=dev  (H2)
#          SPRING_PROFILES_ACTIVE=prod (PostgreSQL)
# =============================================

spring.application.name=lina

# Perfil padrao (desenvolvimento)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# =============================================
# JWT
# NUNCA colocar o valor real aqui - use variavel de ambiente
# Exemplo: export JWT_SECRET=minha-chave-super-secreta-256bits
# =============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
