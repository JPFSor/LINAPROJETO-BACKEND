# =============================================
# Lina - Configuração Base
# Perfil ativo: definir via variável de ambiente
# Exemplo: SPRING_PROFILES_ACTIVE=dev  (H2)
#          SPRING_PROFILES_ACTIVE=prod (PostgreSQL)
# =============================================

spring.application.name=lina

# Perfil padrão (desenvolvimento)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# JWT
# NUNCA colocar o valor real aqui — use variável de ambiente
# Exemplo: export JWT_SECRET=minha-chave-super-secreta-256bits
# =============================================
jwt.secret=${JWT_SECRET:chave-local-insegura-apenas-dev}
jwt.expiration=86400000
